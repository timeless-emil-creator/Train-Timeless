<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Timeless</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.webmanifest" />
<meta name="theme-color" content="#f6f4ea" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="default" />
<meta name="apple-mobile-web-app-title" content="Timeless" />
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />

<style>
  @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Anton&display=swap');

  :root{
    --bg-void: #f6f4ea;
    --bg-void-2: #efece0;
    --card-black: #fbfaf4;
    --card-black-2: #f1efe3;
    --ink: #15130d;
    --ink-dim: #4a473e;
    --ink-faint: #8a8677;
    --hairline: rgba(21,19,13,0.10);
    --hairline-strong: rgba(21,19,13,0.22);

    /* tokens for the page surface, kept as separate names from the
       card's own tokens above in case they ever need to diverge again */
    --page-bg: #f6f4ea;
    --page-ink: #15130d;
    --page-ink-dim: #4a473e;
    --page-ink-faint: #8a8677;
    --page-hairline: rgba(21,19,13,0.10);
    --page-hairline-strong: rgba(21,19,13,0.24);

    /* light tokens for elements sitting directly on the dark modal scrim,
       where card/page ink (now black) would be invisible */
    --on-scrim: #f4f1e7;
    --on-scrim-dim: rgba(244,241,231,0.7);
    --on-scrim-hairline: rgba(244,241,231,0.35);

    --intent-recovery: #d8d3bf;
    --intent-maintenance: #6f8f5c;
    --intent-growth: #b98626;
    --intent-maximum: #a3402f;

    --accent: var(--intent-maintenance);

    --font-display: 'Instrument Serif', Georgia, serif;
    --font-mono: 'IBM Plex Mono', ui-monospace, monospace;
    --font-sans: 'Inter', -apple-system, sans-serif;
    --font-condensed: 'Anton', 'Inter', sans-serif;

    --ease: cubic-bezier(.22,.61,.36,1);
  }

  *{ box-sizing: border-box; }

  html,body{
    margin:0; padding:0;
    background: var(--page-bg);
    color: var(--page-ink);
    font-family: var(--font-sans);
    -webkit-font-smoothing: antialiased;
    min-height: 100vh;
  }

  body{
    background-image:
      radial-gradient(circle at 1px 1px, rgba(22,21,15,0.05) 1px, transparent 0);
    background-size: 22px 22px;
  }

  button, input, textarea{
    font-family: inherit;
    color: inherit;
  }

  button{
    background: none;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  input:focus-visible, button:focus-visible, [tabindex]:focus-visible{
    outline: 1px solid var(--accent);
    outline-offset: 3px;
  }

  ::selection{ background: var(--accent); color: #0b0b0a; }

  /* ---------- layout shell ---------- */

  #app{ min-height: 100vh; display:flex; flex-direction:column; }

  .topnav{
    position: sticky; top:0; z-index: 20;
    display:flex; align-items:center; justify-content:space-between;
    padding: 22px clamp(20px, 5vw, 56px);
    background: linear-gradient(to bottom, var(--page-bg) 60%, transparent);
  }

  .wordmark{
    height: 16px;
    width: auto;
    display: block;
  }

  .tabs{ display:flex; gap: 20px; }

  .tab{
    font-family: var(--font-display);
    font-size: 14px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--page-ink-faint);
    padding-bottom: 4px;
    border-bottom: 1px solid transparent;
    transition: color .25s var(--ease), border-color .25s var(--ease);
  }
  .tab:hover{ color: var(--page-ink-dim); }
  .tab.active{ color: var(--page-ink); font-weight: 600; border-bottom-width: 2px; border-bottom-color: var(--accent); }

  .tab-label-short{ display: none; }

  @media (max-width: 760px){
    .topnav{ padding: 16px 16px; gap: 10px; }
    .wordmark{ height: 13px; }
    .tabs{ gap: 12px; }
    .tab{ font-size: 11.5px; letter-spacing: 0.06em; padding-bottom: 3px; }
    .tab-label-full{ display: none; }
    .tab-label-short{ display: inline; }
    .account-avatar{ width: 28px; height: 28px; font-size: 11px; }
  }

  main{ flex:1; display:flex; flex-direction: column; align-items:center; padding: 8px 20px 100px; }

  /* ---------- practice card ---------- */

  .card-stage{
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top: clamp(18px, 4vh, 48px);
  }

  .practice-card{
    position: relative;
    width: min(460px, 100%);
    background: var(--card-black);
    border: 1px solid var(--hairline-strong);
    border-radius: 26px;
    padding: clamp(40px, 7vw, 58px) clamp(32px, 7vw, 48px) 40px;
    display:flex;
    flex-direction:column;
    box-shadow: 0 40px 80px -32px rgba(21,19,13,0.26), 0 1px 0 rgba(255,255,255,0.6) inset;
    transition: transform .6s var(--ease), opacity .55s var(--ease), box-shadow .4s var(--ease);
  }

  .practice-card:not(.mini){
    animation: card-glow-breathe 7s ease-in-out infinite;
  }
  @keyframes card-glow-breathe{
    0%, 100% {
      box-shadow: 0 40px 80px -32px rgba(21,19,13,0.26), 0 1px 0 rgba(255,255,255,0.6) inset,
        0 0 50px -14px color-mix(in srgb, var(--intent-color, transparent) 35%, transparent);
    }
    50% {
      box-shadow: 0 40px 80px -32px rgba(21,19,13,0.26), 0 1px 0 rgba(255,255,255,0.6) inset,
        0 0 70px -10px color-mix(in srgb, var(--intent-color, transparent) 55%, transparent);
    }
  }

  .practice-card::before{
    content:'';
    position:absolute; inset:0;
    border-radius:26px;
    padding:1px;
    background: linear-gradient(180deg, var(--intent-color, transparent), transparent 40%);
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0.9;
    pointer-events:none;
    transition: background .4s var(--ease);
  }

  .practice-card.mini{
    min-height: 0;
    padding: 10px 12px;
    border-radius: 10px;
    gap: 6px;
    cursor:pointer;
    transition: transform .2s var(--ease), border-color .2s var(--ease);
  }
  .practice-card.mini:hover{ transform: translateY(-2px); border-color: var(--hairline-strong); }

  .practice-card.saving{
    transform: scale(0.85) translateY(28px) rotate(-2deg);
    opacity: 0;
    box-shadow: none;
  }

  .practice-card.entering{
    animation: settle-in .55s var(--ease);
  }
  @keyframes settle-in{
    from{ transform: scale(0.92) rotate(1.5deg); opacity: 0; }
    to{ transform: scale(1) rotate(0); opacity: 1; }
  }

  .card-eyebrow{
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .back-to-picker{
    display:block;
    margin-bottom: 14px;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
    transition: color .2s var(--ease);
  }
  .back-to-picker:hover{ color: var(--accent); }

  .card-stage-back{
    display:block;
    width: min(460px, 100%);
    margin: 0 auto 12px;
    text-align: left;
  }

  .pillar-back-btn{
    position: sticky;
    top: 76px;
    z-index: 15;
    display:inline-flex; align-items:center; gap: 6px;
    margin-bottom: 18px;
    padding: 12px 20px;
    background: var(--page-bg);
    border: 1px solid var(--page-hairline-strong);
    border-radius: 999px;
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 14px;
    color: var(--page-ink);
    box-shadow: 0 6px 16px -8px rgba(21,19,13,0.18);
    transition: border-color .2s var(--ease), color .2s var(--ease), transform .15s var(--ease);
  }
  .pillar-back-btn:hover{ border-color: var(--accent); color: var(--accent); transform: translateX(-2px); }

  .card-heading{
    margin-top: 10px;
  }

  .card-heading .today{
    font-family: var(--font-display);
    font-size: clamp(32px, 8vw, 38px);
    color: var(--ink);
    line-height: 1.05;
  }

  .card-heading .date{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.06em;
    color: var(--ink-faint);
    margin-top: 6px;
  }

  .hr{
    border:none;
    border-top: 1px solid var(--hairline);
    margin: 26px 0 6px;
  }

  .movements{
    display:grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 26px 20px;
    margin-top: 34px;
  }

  .empty-prompt{
    font-family: var(--font-display);
    font-style: italic;
    font-size: 19px;
    color: var(--ink-faint);
    margin: 34px 0 16px;
  }

  .movement-entry{
    display:flex;
    flex-direction:column;
    gap: 5px;
    text-align:left;
    min-width: 0;
  }

  .movement-name{
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .movement-value{
    font-family: var(--font-display);
    font-style: italic;
    font-size: 22px;
    color: var(--ink);
    line-height: 1.2;
    display:flex;
    align-items:baseline;
    gap: 6px;
    flex-wrap: wrap;
  }

  .editable-num{
    font: inherit;
    font-style: normal;
    color: inherit;
    background: transparent;
    border: none;
    padding: 0;
    margin: 0;
    text-align: left;
  }
  .editable-num:focus{ color: var(--accent); }

  .movement-tag{
    font-family: var(--font-mono);
    font-size: 10px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink-faint);
    text-align:left;
    transition: color .2s var(--ease);
  }
  .movement-tag:hover{ color: var(--accent); }
  .movement-tag .tag-dots{ opacity: 0.55; margin-left: 3px; }

  .intention-line{
    margin-top: 46px;
    padding-top: 28px;
    border-top: 1px solid var(--hairline);
    display:flex;
    flex-direction: column;
    gap: 16px;
  }

  .intention-eyebrow{
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.28em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }

  .intention-dots{ display:flex; align-items:center; gap: 22px; flex-wrap: wrap; }

  .intention-dot-btn{
    width: 24px; height:24px; border-radius:50%;
    border: 2px solid rgba(0,0,0,0.24);
    padding:0;
    transition: transform .22s var(--ease), box-shadow .22s var(--ease);
  }
  .intention-dot-btn.selected{
    box-shadow: 0 0 0 5px rgba(21,19,13,0.12);
    transform: scale(1.14);
  }

  .intention-selected-label{
    font-family: var(--font-display);
    font-style: italic;
    font-size: 18px;
    color: var(--ink);
  }

  /* ---------- signal selection flow ---------- */

  .signal-picker{ display:flex; flex-direction:column; }

  .signal-prompt-title{
    font-family: var(--font-display);
    font-size: clamp(26px, 7vw, 32px);
    color: var(--ink);
    line-height: 1.15;
    margin-top: 8px;
  }

  .signal-prompt-subtitle{
    margin-top: 10px;
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--ink-faint);
  }

  .signal-options{
    margin-top: 30px;
    display:flex;
    flex-direction: column;
    gap: 14px;
  }

  .signal-option{
    display:flex;
    align-items:center;
    gap: 16px;
    width:100%;
    text-align:left;
    padding: 16px 18px;
    border: 1px solid var(--hairline-strong);
    border-radius: 18px;
    color: var(--ink);
    transition: background .2s var(--ease), border-color .2s var(--ease), opacity .28s var(--ease), transform .28s var(--ease);
  }
  .signal-option:hover{ border-color: var(--accent); }

  .signal-option-icon{
    width: 52px; height: 52px;
    display:flex; align-items:center; justify-content:center;
    border-radius: 50%;
    flex-shrink:0;
  }

  .signal-option-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap: 3px; }

  .signal-option-title{
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 15px;
    letter-spacing: 0.01em;
    color: var(--ink);
  }

  .signal-option-subtitle{
    font-family: var(--font-sans);
    font-size: 12.5px;
    color: var(--ink-faint);
    line-height: 1.35;
  }

  .signal-option-chevron{
    flex-shrink:0;
    font-size: 18px;
    color: var(--ink-faint);
  }

  .signal-step-hint{
    display:flex;
    align-items:center;
    justify-content:center;
    gap: 10px;
    margin-top: 24px;
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--page-ink-faint);
  }
  .signal-step-num{
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1px solid var(--page-hairline-strong);
    display:flex; align-items:center; justify-content:center;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--page-ink-dim);
    flex-shrink:0;
  }


  .contribution-block{ margin-top: 30px; }
  .contribution-list{ margin-top: 14px; display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .contribution-item{
    padding: 14px 12px;
    border: 1px solid var(--hairline);
    border-radius: 10px;
    font-family: var(--font-sans); font-size: 12.5px; color: var(--ink-dim);
  }

  .signal-active-header{
    display:flex;
    align-items:flex-start;
    gap: 14px;
  }

  .signal-icon-badge{
    width: 40px; height: 40px;
    border-radius: 50%;
    display:flex; align-items:center; justify-content:center;
    flex-shrink:0;
    border: 1px solid rgba(0,0,0,0.12);
  }
  .signal-badge-recovery{ background: var(--intent-recovery); color: var(--ink); }
  .signal-badge-maintenance{ background: var(--intent-maintenance); color: #fbfaf4; }
  .signal-badge-growth{ background: var(--intent-growth); color: #fbfaf4; }
  .signal-badge-maximum{ background: var(--intent-maximum); color: #fbfaf4; }

  .signal-header-text{ padding-top: 1px; }

  .signal-header-title{
    font-family: var(--font-sans);
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--ink);
  }

  .signal-header-tagline{
    margin-top: 3px;
    font-family: var(--font-display);
    font-style: italic;
    font-size: 13.5px;
    color: var(--ink-dim);
  }

  .signal-active-header.just-signaled{ animation: signal-header-in 360ms var(--ease); }
  @keyframes signal-header-in{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }

  .practice-card.just-signaled::before{ animation: signal-wash-in 380ms var(--ease); }
  @keyframes signal-wash-in{
    from{ opacity: 0; }
    to{ opacity: 0.9; }
  }

  .save-row{
    width: min(460px, 100%);
    margin-top: 24px;
  }

  .save-btn{
    width:100%;
    padding: 16px;
    border: 1px solid var(--page-hairline-strong);
    border-radius: 12px;
    font-family: var(--font-sans);
    font-size: 13px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--page-ink);
    text-align:center;
    transition: background .25s var(--ease), color .25s var(--ease), border-color .25s var(--ease);
  }
  .save-btn:hover{ filter: brightness(0.92); }
  .save-btn:disabled{ opacity: 0.35; pointer-events:none; }

  /* mini card (history grid) */
  .mini-eyebrow{ font-family: var(--font-mono); font-size: 8.5px; letter-spacing:0.16em; color: var(--ink-faint); text-transform:uppercase; }
  .mini-list{ display:flex; flex-direction:column; gap:1px; margin-top:2px; }
  .mini-move{ font-family: var(--font-sans); font-size: 10.5px; color: var(--ink-dim); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .mini-more{ font-family: var(--font-mono); font-size: 9.5px; color: var(--ink-faint); }

  /* ---------- search overlay ---------- */

  .overlay-scrim{
    position:fixed; inset:0; z-index: 50;
    background: rgba(6,6,5,0.72);
    backdrop-filter: blur(6px);
    display:flex; align-items:flex-start; justify-content:center;
    padding: 12vh 20px 20px;
    animation: fade-in .2s var(--ease);
  }
  @keyframes fade-in{ from{ opacity:0; } to{ opacity:1; } }

  .search-panel{
    width: min(440px, 100%);
    background: var(--card-black-2);
    border: 1px solid var(--hairline-strong);
    border-radius: 16px;
    overflow:hidden;
    box-shadow: 0 50px 100px -30px rgba(0,0,0,0.8);
    animation: rise-in .28s var(--ease);
  }
  @keyframes rise-in{ from{ opacity:0; transform: translateY(10px) scale(0.98); } to{ opacity:1; transform:none; } }

  .search-tabs{
    display:flex;
    border-bottom: 1px solid var(--hairline);
  }
  .search-tab{
    flex:1;
    padding: 14px 8px;
    text-align:center;
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-faint);
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    transition: color .2s var(--ease), border-color .2s var(--ease);
  }
  .search-tab:hover{ color: var(--ink-dim); }
  .search-tab.active{ color: var(--ink); border-color: var(--accent); }

  .search-input{
    width:100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--hairline);
    padding: 20px 22px;
    font-family: var(--font-display);
    font-size: 22px;
    font-style: italic;
    color: var(--ink);
  }
  .search-input::placeholder{ color: var(--ink-faint); }

  .search-results{ max-height: 46vh; overflow-y:auto; padding: 6px 0 10px; }

  .search-group-label{
    padding: 14px 22px 6px;
    font-family: var(--font-mono);
    font-size: 9.5px;
    letter-spacing: 0.12em;
    color: var(--ink-faint);
  }

  .search-item{
    width:100%; text-align:left;
    padding: 12px 22px;
    font-family: var(--font-sans);
    font-size: 15px;
    color: var(--ink-dim);
    display:flex; justify-content:space-between; align-items:center;
    transition: background .15s, color .15s;
  }
  .search-item:hover{ background: rgba(21,19,13,0.045); color: var(--ink); }

  .search-empty{ padding: 22px; text-align:center; color: var(--ink-faint); font-family: var(--font-sans); font-size: 13px; }

  /* ---------- movement type menu (replaces the old heavy bottom sheet) ---------- */

  .type-menu-scrim{
    position:fixed; inset:0; z-index:60;
    background: rgba(6,6,5,0.68);
    backdrop-filter: blur(6px);
    display:flex; align-items:center; justify-content:center;
    padding: 20px;
    animation: fade-in .2s var(--ease);
  }

  .type-menu{
    width: min(300px, 100%);
    background: var(--card-black-2);
    border: 1px solid var(--hairline-strong);
    border-radius: 18px;
    padding: 22px 6px;
    box-shadow: 0 40px 90px -30px rgba(0,0,0,0.55);
    animation: rise-in .24s var(--ease);
  }

  .type-menu-title{
    font-family: var(--font-display);
    font-style: italic;
    font-size: 19px;
    color: var(--ink);
    padding: 0 20px 14px;
  }

  .type-menu-item{
    width:100%; text-align:left;
    padding: 11px 20px;
    font-family: var(--font-sans);
    font-size: 14px;
    color: var(--ink-dim);
    transition: background .15s, color .15s;
  }
  .type-menu-item:hover{ background: rgba(21,19,13,0.045); color: var(--ink); }
  .type-menu-item.active{ color: var(--ink); font-weight: 600; }

  .type-menu-divider{ border:none; border-top:1px solid var(--hairline); margin: 8px 14px; }

  .type-menu-remove{
    width:100%; text-align:left;
    padding: 11px 20px;
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--ink-faint);
    transition: color .15s;
  }
  .type-menu-remove:hover{ color: var(--intent-maximum); }

  /* ---------- practice tab (pillar picker) ---------- */

  .home-shell{ width: min(1040px, 100%); padding: 16px 0 70px; }

  .home-hero-row{
    display:flex; align-items:flex-start; justify-content:space-between;
    gap: 32px; flex-wrap: wrap;
    margin-bottom: 34px;
  }
  .home-hero-title{
    font-family: var(--font-display);
    font-size: clamp(46px, 8.6vw, 78px);
    line-height: 0.98;
    letter-spacing: -0.01em;
    color: var(--page-ink);
  }

  /* --- adaptation zone: a living system, not a slider --- */
  .adaptation-zone-card{
    flex-shrink: 0;

  /* --- pillar tiles: layered poster design with figure artwork --- */
  .home-pillar-grid{

      repeating-linear-gradient(90deg, rgba(244,241,231,0.05) 0px, rgba(244,241,231,0.05) 1px, transparent 1px, transparent 14px),

  .home-pillar-count{ font-family: var(--font-sans); font-size: 16px; color: #f4f1e7; }
  .home-pillar-count-label{ font-family: var(--font-sans); font-size: 9.5px; color: rgba(244,241,231,0.55); margin-top: 2px; }

  /* --- panel row: Signals, Active Recovery, Current Rhythm, Today's Insight --- */
  .home-columns{

    padding: 28px 26px;

  .home-signals-list{ margin-top: 22px; display:flex; flex-direction:column; }

  @media (max-width: 760px){

  .pillar-card{
    display:flex; align-items:center; justify-content:space-between;

  /* --- Training Methods: editorial list + detail page --- */

  /* --- Foundations: large editorial cards with a black hero tile --- */
  .foundation-card-list{ margin-top: 16px; display:flex; flex-direction:column; gap: 24px; }

    border: 1px solid var(--page-hairline-strong);

  .foundation-body{

<!--
  ============================================================
  CONNECTING A REAL BACKEND (Supabase)
  ============================================================
  The screens below (Sign Up / Log In / Forgot Password / Reset
  Password) are fully built and wired to call the Supabase Auth
  API — they just need a real project to talk to.

  1. Create a free project at https://supabase.com
  2. Go to Project Settings -> Data API and copy your "Project URL"
     into SUPABASE_URL below. Then go to Project Settings -> API Keys
     and copy your "Publishable key" (labeled "anon" on older
     projects) into SUPABASE_ANON_KEY. Never use the "Secret key"
     (labeled "service_role" on older projects) here — that one
     bypasses Row Level Security and must never appear in
     client-side code.
  3. In Authentication -> Providers -> Email, turn OFF
     "Confirm email" if you want username-only accounts to work
     immediately (they sign up with a placeholder address under
     the hood — see the comment above signUpWithUsername()).
  4. Run this SQL in the Supabase SQL editor to create the
     username -> email lookup table login needs:

     create table profiles (
       id uuid references auth.users on delete cascade primary key,
       username text unique not null,
       real_email text,
       created_at timestamp with time zone default now()
     );
     alter table profiles enable row level security;
     create policy "Users can read their own profile"
       on profiles for select using (auth.uid() = id);
     create policy "Public username lookup for login"
       on profiles for select using (true);
     create policy "Users can update their own profile"
       on profiles for update using (auth.uid() = id);
     create policy "Users can insert their own profile"
       on profiles for insert with check (auth.uid() = id);

  Until SUPABASE_URL/SUPABASE_ANON_KEY are filled in, the screens

  function placeholderEmailFor(username){

      if(!BACKEND_READY) return { error: NOT_CONNECTED_ERROR };

      if(error) return { error: error.message };
      if(data.user){
        const { error: profileError } = await sb.from('profiles').insert({ id: data.user.id, username });
        if(profileError) return { error: profileError.message };
      }
      return { user: data.user };
    },

    async logInWithUsername(username, password){
      if(!BACKEND_READY) return { error: NOT_CONNECTED_ERROR };
      const { data: profile, error: lookupError } = await sb.from('profiles').select('id').eq('username', username).single();

      if(error) return { error: error.message };

  function movementIllustrationHtml(name, size){
    const s = size || 60;
    if(MOVEMENT_ILLUSTRATION_IMAGES[name]){
      const maxH = Math.round(s * 1.15);
      const maxW = Math.round(s * 1.7);
      return `<img src="${MOVEMENT_ILLUSTRATION_IMAGES[name]}" alt="${esc(name)}" style="max-height:${maxH}px; max-width:${maxW}px; width:auto; height:auto; display:block; object-fit:contain;" />`;
    }
    return movementIllustrationSvg(name, size);
  }

  let uidCounter = 1;
  function uid(){ return 'id' + (uidCounter++) + '_' + Math.random().toString(36).slice(2,7); }

  function freshDraft(){
    return { id: null, dateKey: null, movements: [], intention: null };
  }

  const state = {
    view: 'practice',              // 'practice' | 'methods' | 'adaptation'
    draft: freshDraft(),
    practices: [],                 // saved cards
    searchOpen: false,
    searchQuery: '',
    searchTab: 'mine',              // 'mine' | 'all' — which list the search overlay shows
    typeMenuId: null,              // id of movement whose type/remove menu is open
    savingAnim: false,
    openMethod: null,              // key of the training method whose detail page is open
    accountMenuOpen: false,        // whether the profile submenu is open
    cardDetailId: null,            // practice id currently open in the card detail modal (from the week timeline)
    justPickedSignal: false,       // true for one render right after choosing a signal (drives entrance animation)
    challengePeriod: 'week',       // 'week' | 'month' | 'year' | 'all' — donut chart window on the Adaptation page

    openPillar: null,              // 'pull' | 'push' | 'legs' | 'core' | null — which pillar is being browsed
    openMovementName: null,        // movement whose detail page is open (within a pillar browse)
    loggingMovementName: null,     // movement whose "add reps" sheet is open
    myPractice: [],                // movement names the user has added to their personal library
    practiceContinued: false,      // true once "Continue →" is pressed, moving from logging into signal-picking

    user: null,                    // logged-in user (username, email) once a real backend is connected
    authView: null,                // null | 'signup' | 'login' | 'forgot' | 'reset'
    authLoading: false,
    authError: null,
    authNotice: null,
    loginMethod: 'username',       // 'username' | 'email' — which field the Log In screen shows
  };

  /* ---------------- utils ---------------- */

  function pad(n){ return String(n).padStart(2,'0'); }
  function dateKey(d){ return d.getFullYear() + '-' + pad(d.getMonth()+1) + '-' + pad(d.getDate()); }
  function todayKey(){ return dateKey(new Date()); }
  function dateFromKey(key){
    const [y,m,d] = key.split('-').map(Number);
    return new Date(y, m-1, d);
  }

  function formatTodayHeading(){
    const d = new Date();
    return d.toLocaleDateString(undefined, { month:'short', day:'numeric', year:'numeric' });
  }

  function formatMeasurement(m){
    if(m.type === 'reps') return `${m.values.reps} Reps`;
    if(m.type === 'setsReps') return `${m.values.sets} × ${m.values.reps}`;
    if(m.type === 'duration'){
      const mm = m.values.minutes||0, ss = m.values.seconds||0;
      return `${mm} min ${pad(ss)} sec`;
    }
    if(m.type === 'distance') return `${m.values.distance} km`;
    if(m.type === 'rounds') return `${m.values.rounds} Rounds`;
    return '';
  }

  const TYPE_CATEGORY_LABEL = {
    reps: 'Repetition',
    setsReps: 'Repetition',
    duration: 'Duration',
    distance: 'Distance',
    rounds: 'Rounds',
  };

  function typeCategoryLabel(type){
    return TYPE_CATEGORY_LABEL[type] || '';
  }

  function numInputWidth(value){
    const len = String(value).length;
    return Math.max(len, 1) + 0.65 + 'ch';
  }

  function editableNum(movementId, key, value){
    return `<input class="editable-num" type="text" inputmode="decimal" autocomplete="off"
      data-movement-id="${movementId}" data-field-key="${key}"
      style="width:${numInputWidth(value)};" value="${esc(value)}" />`;
  }

  function renderEditableValue(m){
    if(m.type === 'reps'){
      return `${editableNum(m.id,'reps',m.values.reps)} Reps`;
    }
    if(m.type === 'setsReps'){
      return `${editableNum(m.id,'sets',m.values.sets)} × ${editableNum(m.id,'reps',m.values.reps)}`;
    }
    if(m.type === 'duration'){
      return `${editableNum(m.id,'minutes',m.values.minutes)} min ${editableNum(m.id,'seconds',m.values.seconds)} sec`;
    }
    if(m.type === 'distance'){
      return `${editableNum(m.id,'distance',m.values.distance)} km`;
    }
    if(m.type === 'rounds'){
      return `${editableNum(m.id,'rounds',m.values.rounds)} Rounds`;
    }
    return '';
  }

  function defaultValuesForType(type){
    const cfg = MEASUREMENT_TYPES[type];
    const v = {};
    cfg.fields.forEach(f => v[f.key] = f.default);
    return v;
  }

  function esc(str){
    return String(str).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function practicesOnDay(key){
    return state.practices.filter(p => p.dateKey === key);
  }

  function practiceCardNumber(id){
    const ordered = [...state.practices].sort((a,b) => new Date(a.savedAt) - new Date(b.savedAt));
    return ordered.findIndex(p => p.id === id) + 1;
  }

  /* ---------------- rendering: practice card ---------------- */

  function renderSignalHeader(intentionKey, justSignaled){
    if(!intentionKey) return `<div class="card-eyebrow">Practice Card</div>`;
    const sig = INTENTIONS.find(i => i.key === intentionKey);
    if(!sig) return `<div class="card-eyebrow">Practice Card</div>`;
    return `
      <div class="signal-active-header ${justSignaled ? 'just-signaled' : ''}">
        <div class="signal-icon-badge signal-badge-${sig.key}">${signalIconSvg(sig.key, 20)}</div>
        <div class="signal-header-text">
          <div class="signal-header-title">${esc(sig.label.toUpperCase())} SIGNAL</div>
          <div class="signal-header-tagline">${esc(sig.note)}</div>
        </div>
      </div>
    `;
  }

  function renderCardHeader(mode, practice, justSignaled){
    if(mode === 'mini'){
      return `<div class="mini-eyebrow">Practice Card</div>`;
    }
    let dateStr, heading, intentionKey;
    if(practice){
      dateStr = new Date(practice.savedAt).toLocaleDateString(undefined,{ month:'short', day:'numeric', year:'numeric' });
      heading = new Date(practice.savedAt).toLocaleDateString(undefined,{ weekday:'long' });
      intentionKey = practice.intention;
    } else if(state.draft.dateKey){
      const d = dateFromKey(state.draft.dateKey);
      dateStr = d.toLocaleDateString(undefined,{ month:'short', day:'numeric', year:'numeric' });
      heading = state.draft.dateKey === todayKey() ? 'Today' : d.toLocaleDateString(undefined,{ weekday:'long' });
      intentionKey = state.draft.intention;
    } else {
      dateStr = formatTodayHeading();
      heading = 'Today';
      intentionKey = state.draft.intention;
    }
    return `
      ${renderSignalHeader(intentionKey, justSignaled)}
      <div class="card-heading">
        <div class="today">${esc(heading)}</div>
        <div class="date">${esc(dateStr)}</div>
      </div>
    `;
  }

  function renderSignalPicker(){
    const options = INTENTIONS.map(i => `
      <button class="signal-option" data-action="pick-signal" data-key="${i.key}">
        <span class="signal-option-icon signal-badge-${i.key}">${signalIconSvg(i.key, 22)}</span>
        <span class="signal-option-text">
          <span class="signal-option-title">${esc(i.label)}</span>
          <span class="signal-option-subtitle">${esc(i.pickerNote)}</span>
        </span>
        <span class="signal-option-chevron">›</span>
      </button>
    `).join('');
    return `
      <div class="signal-picker">
        <div class="signal-prompt-title">${state.draft.movements.length ? 'What signal did today\u2019s practice send?' : 'How did you practise today?'}</div>
        <div class="signal-prompt-subtitle">Choose the signal that best reflects today's practice.</div>
        <div class="signal-options">${options}</div>
      </div>
    `;
  }

  function renderMovementsEdit(){
    const list = state.draft.movements;

    if(list.length === 0){
      const isToday = !state.draft.dateKey || state.draft.dateKey === todayKey();
      const prompt = isToday ? 'What did you practice today?' : 'What did you practice that day?';
      return `
        <div class="empty-prompt">${prompt}</div>
      `;
    }

    const entries = list.map(m => `
      <div class="movement-entry">
        <div class="movement-name">${esc(m.name)}</div>
        <div class="movement-value">${renderEditableValue(m)}</div>
        <button class="movement-tag" data-action="open-type-menu" data-id="${m.id}">${esc(typeCategoryLabel(m.type))}<span class="tag-dots">⋯</span></button>
      </div>
    `).join('');

    return `
      <div class="movements">${entries}</div>
    `;
  }

  function renderMovementsDisplay(practice){
    if(practice.movements.length === 0) return '';
    return `<div class="movements">${practice.movements.map(m => `
      <div class="movement-entry">
        <div class="movement-name">${esc(m.name)}</div>
        <div class="movement-value">${esc(formatMeasurement(m))}</div>
        <div class="movement-tag">${esc(typeCategoryLabel(m.type))}</div>
      </div>`).join('')}</div>`;
  }

  function renderIntentionEdit(){
    const sel = state.draft.intention;
    const selObj = INTENTIONS.find(i => i.key === sel);
    return `
      <div class="intention-line">
        <span class="intention-eyebrow">Signal</span>
        <div class="intention-dots">
          ${INTENTIONS.map(i => `
            <button class="intention-dot-btn ${sel===i.key?'selected':''}" style="background:${i.color};" data-action="select-intention" data-key="${i.key}" title="${esc(i.label)} — ${esc(i.note)}"></button>
          `).join('')}
        </div>
        ${selObj ? `<span class="intention-selected-label">${esc(selObj.label)} — ${esc(selObj.note)}</span>` : ''}
      </div>
    `;
  }

  function renderIntentionDisplay(practice){
    if(!practice.intention) return '';
    const selObj = INTENTIONS.find(x => x.key === practice.intention);
    return `
      <div class="intention-line">
        <span class="intention-eyebrow">Signal</span>
        <div class="intention-dots">
          ${INTENTIONS.map(x => `
            <span class="intention-dot-btn ${x.key===practice.intention?'selected':''}" style="background:${x.color}; ${x.key!==practice.intention?'opacity:.28;':''}" title="${esc(x.label)} — ${esc(x.note)}"></span>
          `).join('')}
        </div>
        ${selObj ? `<span class="intention-selected-label">${esc(selObj.label)} — ${esc(selObj.note)}</span>` : ''}
      </div>
    `;
  }

  function intentionColorVar(key){
    const i = INTENTIONS.find(x => x.key === key);
    return i ? i.color : 'transparent';

  function daysSince(iso){
    return Math.floor((Date.now() - new Date(iso).getTime()) / 86400000);
  }

  function formatOrdinalDate(d){
    const day = d.getDate();
    const month = d.toLocaleDateString(undefined,{ month:'long' });
    const suffix = (day % 10 === 1 && day !== 11) ? 'st'
      : (day % 10 === 2 && day !== 12) ? 'nd'
      : (day % 10 === 3 && day !== 13) ? 'rd' : 'th';
    return `${month} ${day}${suffix}`;
  }

  function getWeekDatesMonFirst(weeksAgo){
    const today = new Date();
    const dow = today.getDay(); // 0 = Sun .. 6 = Sat
    const diffToMonday = dow === 0 ? -6 : 1 - dow;
    const monday = new Date(today.getFullYear(), today.getMonth(), today.getDate() + diffToMonday - (weeksAgo || 0) * 7);
    const days = [];
    for(let i = 0; i < 7; i++){
      days.push(new Date(monday.getFullYear(), monday.getMonth(), monday.getDate() + i));
    }
    return days;
  }

  function renderWeekTimeline(title, weekCount){
    const count = weekCount || 1;
    const dayLabels = ['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const tKey = todayKey();
    const rowLabels = ['This Week','Last Week','2 Weeks Ago','3 Weeks Ago'];

    const rows = [];
    for(let w = 0; w < count; w++){
      const days = getWeekDatesMonFirst(w);
      const cells = days.map((d, i) => {
        const key = dateKey(d);
        const p = practicesOnDay(key)[0];
        const isToday = key === tKey;
        const label = dayLabels[i];

        if(p){
          const badgeClass = p.intention ? `signal-badge-${p.intention}` : '';
          return `
            <div class="week-timeline-cell has-signal ${isToday ? 'today-cell' : ''}">
              ${count === 1 ? `<div class="week-timeline-daylabel">${label}</div>` : ''}
              <button class="week-timeline-symbol ${badgeClass}" data-action="open-card-detail" data-id="${p.id}">
                ${p.intention ? signalIconSvg(p.intention, 17) : ''}
              </button>
              <div class="week-timeline-date">${esc(formatOrdinalDate(d))}</div>
            </div>
          `;
        }
        return `
          <div class="week-timeline-cell ${isToday ? 'today-cell' : ''}">
            ${count === 1 ? `<div class="week-timeline-daylabel">${label}</div>` : ''}
            <div class="week-timeline-daynum">${d.getDate()}</div>
          </div>
        `;
      }).join('');
      rows.push(`
        <div class="week-timeline-group">
          ${count > 1 ? `<div class="week-timeline-row-label">${esc(rowLabels[w] || `${w} Weeks Ago`)}</div>` : ''}
          <div class="week-timeline-row">${cells}</div>
        </div>
      `);
    }

    return `
      <div class="week-strip-section">
        <div class="week-strip-label">${esc(title || 'This Week')}</div>
        <div class="week-timeline-rows">${rows.join('')}</div>
      </div>
    `;
  }

      </div>

  const METHOD_CATEGORY_ORDER = ['Foundations','Strength','Endurance','Skill'];

  function practicesInPeriod(period){
    if(period === 'all') return state.practices;
    const cutoffDays = period === 'week' ? 7 : period === 'month' ? 30 : 365;
    const now = Date.now();
    return state.practices.filter(p => (now - new Date(p.savedAt).getTime()) / 86400000 <= cutoffDays);
  }

  function movementNumericValue(m){
    if(m.type === 'reps') return m.values.reps || 0;
    if(m.type === 'setsReps') return (m.values.sets||0) * (m.values.reps||0);
    if(m.type === 'duration') return Math.round(((m.values.minutes||0)*60 + (m.values.seconds||0)) / 60);
    if(m.type === 'distance') return m.values.distance || 0;
    if(m.type === 'rounds') return m.values.rounds || 0;
    return 0;
  }

  function computeRhythm(){
    const sorted = [...state.practices].sort((a,b) => new Date(a.savedAt) - new Date(b.savedAt));
    const recent = sorted.slice(-8);
    if(recent.length < 2) return { avg: null, status: null };
    let total = 0;
    for(let i = 1; i < recent.length; i++) total += (new Date(recent[i].savedAt) - new Date(recent[i-1].savedAt)) / 86400000;
    const avg = total / (recent.length - 1);
    const status = avg <= 2 ? 'green' : avg <= 4 ? 'yellow' : 'red';
    return { avg, status };
  }

  function computeChallenge(period){
    const list = practicesInPeriod(period);
    const counts = { recovery:0, maintenance:0, growth:0, maximum:0 };
    list.forEach(p => { if(p.intention && counts[p.intention] !== undefined) counts[p.intention]++; });
    const weeklyGrowth = practicesInPeriod('week').filter(p => p.intention === 'growth').length;
    const status = state.practices.length === 0 ? null : (weeklyGrowth >= 2 ? 'green' : weeklyGrowth === 1 ? 'yellow' : 'red');
    return { counts, total: list.length, status, weeklyGrowth };
  }

  function computeRecovery(){
    const weekList = practicesInPeriod('week');
    const recoveryCount = weekList.filter(p => p.intention === 'recovery').length;
    const maxCountWeek = weekList.filter(p => p.intention === 'maximum').length;
    const sorted = [...state.practices].sort((a,b) => new Date(a.savedAt) - new Date(b.savedAt));
    const gaps = [];
    for(let i = 0; i < sorted.length - 1; i++){
      if(sorted[i].intention === 'maximum'){
        gaps.push((new Date(sorted[i+1].savedAt) - new Date(sorted[i].savedAt)) / 86400000);
      }
    }
    const avgAfterMax = gaps.length ? gaps.reduce((a,b)=>a+b,0) / gaps.length : null;
    let status;
    if(state.practices.length === 0) status = null;
    else if(maxCountWeek === 0) status = recoveryCount >= 1 ? 'green' : 'yellow';
    else status = (avgAfterMax !== null && avgAfterMax >= 1) ? 'green' : (recoveryCount >= 1 ? 'yellow' : 'red');
    return { recoveryCount, avgAfterMax, status };
  }

  function computeVolumeAll(){
    const moveMap = {};
    state.practices.forEach(p => {
      p.movements.forEach(m => {
        if(!moveMap[m.name]) moveMap[m.name] = { name: m.name, lifetime: 0, byDate: {} };
        const val = movementNumericValue(m);
        moveMap[m.name].lifetime += val;
        moveMap[m.name].byDate[p.dateKey] = (moveMap[m.name].byDate[p.dateKey] || 0) + val;
      });
    });
    return moveMap;
  }

  function computeVolume(){
    const moveMap = computeVolumeAll();
    const top4 = Object.values(moveMap).sort((a,b) => b.lifetime - a.lifetime).slice(0, 4);
    const now = Date.now();
    top4.forEach(e => {
      let last30 = 0, prev30 = 0, best = 0;
      Object.entries(e.byDate).forEach(([dk, val]) => {
        const days = (now - dateFromKey(dk).getTime()) / 86400000;
        if(days <= 30) last30 += val;
        else if(days <= 60) prev30 += val;
        if(val > best) best = val;
      });
      e.last30 = last30; e.best = best;
      e.trend = last30 > prev30 * 1.05 ? 'up' : last30 < prev30 * 0.95 && prev30 > 0 ? 'down' : 'flat';
    });
    return top4;
  }

  function computeBalance(){
    const windowDays = 60;
    const now = Date.now();
    const touched = { push:false, pull:false, core:false, legs:false };
    state.practices.forEach(p => {
      if((now - new Date(p.savedAt).getTime()) / 86400000 > windowDays) return;
      p.movements.forEach(m => {
        const pillar = MOVEMENT_PILLAR[m.name];
        if(pillar) touched[pillar] = true;
      });
    });
    return touched;
  }

  /* ================================================================
     INSIGHT ENGINE
     ----------------------------------------------------------------
     A modular, rule-based analysis layer over raw practice data.

     This is a single HTML file with no bundler, so this cannot be
     split into real /insights/frequency.ts, /insights/volume.ts etc.
     files — but the INTENT of that structure is preserved: each rule
     below is an independent, pure function of a shared analytics
     context, grouped by category, with its own priority. New rules
     are added by appending to INSIGHT_RULES — nothing else in the
     app needs to change.

     Nothing here is stored. Every insight is recalculated from
     state.practices (the only raw facts kept) each time the
     Adaptation page renders — i.e. on every open, log, edit, delete,
     since those all trigger a re-render already. That also means
     weekly/monthly "reflections" are recomputed on demand rather
     than saved as a second copy of the data, which keeps faith with
     "never store calculated analytics, only raw facts."
     ================================================================ */

  function computeSignalBalance(){
    const total = state.practices.length;
    const counts = { recovery:0, maintenance:0, growth:0, maximum:0 };
    state.practices.forEach(p => { if(p.intention && counts[p.intention] !== undefined) counts[p.intention]++; });
    const percents = {};
    INTENTIONS.forEach(i => { percents[i.key] = total ? Math.round((counts[i.key] / total) * 100) : 0; });
    return { total, counts, percents };
  }

  function computeConsistency(){
    const sorted = [...state.practices].sort((a,b) => new Date(a.savedAt) - new Date(b.savedAt));
    if(sorted.length < 2) return { longestBreakDays: null, fastestReturnDays: null, latestGapDays: null, gaps: [] };
    const gaps = [];
    for(let i = 1; i < sorted.length; i++){
      gaps.push((new Date(sorted[i].savedAt) - new Date(sorted[i-1].savedAt)) / 86400000);
    }
    return {
      longestBreakDays: Math.max(...gaps),
      fastestReturnDays: Math.min(...gaps),
      latestGapDays: gaps[gaps.length - 1],
      gaps,
    };
  }

  function computePracticePatterns(){
    const total = state.practices.length;
    if(total === 0) return null;
    let morning = 0, evening = 0;
    state.practices.forEach(p => {
      const hour = new Date(p.savedAt).getHours();
      if(hour < 12) morning++; else evening++;
    });
    return { morning, evening, total };
  }

  const SIGNAL_MILESTONES = [10, 25, 50, 75, 100, 250, 500, 1000];
  const INTENTION_MILESTONES = [25, 50, 100, 250];
  const MOVEMENT_MILESTONES = [500, 1000, 2500, 5000, 10000, 25000, 50000, 100000];

  function crossedMilestone(before, after, thresholds){
    return thresholds.find(t => before < t && after >= t) || null;
  }

  // Milestones and records only fire on the day the threshold is actually
  // crossed — computed by comparing the count with vs. without today's
  // signal, so nothing needs to be remembered as "already shown".
  function computeMilestonesToday(){
    const results = [];
    const today = practicesOnDay(todayKey())[0];
    if(!today) return results;

    const totalAfter = state.practices.length;
    const signalMilestone = crossedMilestone(totalAfter - 1, totalAfter, SIGNAL_MILESTONES);
    if(signalMilestone){
      results.push({ id:`signals-${signalMilestone}`, text:`${signalMilestone} Signals sent — a real milestone in your practice.` });
    }

    if(today.intention){
      const afterCount = state.practices.filter(p => p.intention === today.intention).length;
      const m = crossedMilestone(afterCount - 1, afterCount, INTENTION_MILESTONES);
      if(m){
        const label = INTENTIONS.find(i => i.key === today.intention).label;
        results.push({ id:`intent-${today.intention}-${m}`, text:`${m} ${label} signals sent.` });
      }
    }

    const volumeAll = computeVolumeAll();
    const todaysMoveNames = [...new Set(today.movements.map(m => m.name))];
    todaysMoveNames.forEach(name => {
      const entry = volumeAll[name];
      if(!entry) return;
      const contribution = today.movements.filter(m => m.name === name).reduce((s,m) => s + movementNumericValue(m), 0);
      const m = crossedMilestone(entry.lifetime - contribution, entry.lifetime, MOVEMENT_MILESTONES);
      if(m){
        results.push({ id:`move-${name}-${m}`, text:`${m.toLocaleString()} lifetime ${name} logged.` });
      }
    });

    return results;
  }

  function computeRecordsToday(){
    const results = [];
    const today = practicesOnDay(todayKey())[0];
    if(!today) return results;
    const volumeAll = computeVolumeAll();
    const todaysMoveNames = [...new Set(today.movements.map(m => m.name))];
    todaysMoveNames.forEach(name => {
      const entry = volumeAll[name];
      if(!entry || Object.keys(entry.byDate).length < 2) return; // need prior history to "beat"
      const todaysValue = today.movements.filter(m => m.name === name).reduce((s,m) => s + movementNumericValue(m), 0);
      const bestEver = Math.max(...Object.values(entry.byDate));
      if(todaysValue > 0 && todaysValue >= bestEver){
        results.push({ id:`record-${name}-${todayKey()}`, text:`New record: ${todaysValue} ${name} in a single day.` });
      }
    });
    return results;
  }

  // Each rule is independent: given a shared context, return an insight
  // string or null. Add new rules here without touching anything else.
  const INSIGHT_RULES = [
    {
      id:'rhythm-excellent', category:'rhythm', priority:60,
      evaluate(ctx){
        if(ctx.rhythm.status === 'green' && ctx.total >= 5){
          return `Excellent rhythm — averaging ${ctx.rhythm.avg.toFixed(1)} days between signals.`;
        }
        return null;
      },
    },
    {
      id:'rhythm-drifting', category:'rhythm', priority:90,
      evaluate(ctx){
        if(ctx.rhythm.status === 'red'){
          return `Your rhythm has drifted — averaging ${ctx.rhythm.avg.toFixed(1)} days between signals. A practice soon will help restore it.`;
        }
        return null;
      },
    },
    {
      id:'fastest-return', category:'rhythm', priority:50,
      evaluate(ctx){
        const c = ctx.consistency;
        if(c.gaps.length >= 3 && c.latestGapDays === c.fastestReturnDays && c.fastestReturnDays < 1){
          return `That was your fastest return yet — back in under a day.`;
        }
        return null;
      },
    },
    {
      id:'longest-break', category:'rhythm', priority:15,
      evaluate(ctx){
        if(ctx.consistency.longestBreakDays && ctx.consistency.longestBreakDays >= 14){
          return `Your longest gap on record is ${Math.round(ctx.consistency.longestBreakDays)} days — and you came back.`;
        }
        return null;
      },
    },
    {
      id:'no-growth-week', category:'balance', priority:70,
      evaluate(ctx){
        if(ctx.total >= 5 && ctx.challenge.weeklyGrowth === 0){
          return `No Growth signals this week yet. Maintenance keeps practice alive, but Growth is what creates new adaptation.`;
        }
        return null;
      },
    },
    {
      id:'balanced-signal-mix', category:'balance', priority:35,
      evaluate(ctx){
        const c = ctx.signalBalance.counts;
        if(ctx.total >= 12 && c.recovery > 0 && c.maintenance > 0 && c.growth > 0 && c.maximum > 0){
          return `Your signal mix has included all four intentions — Recovery, Maintenance, Growth, and Maximum.`;
        }
        return null;
      },
    },
    {
      id:'recovery-missing-after-max', category:'balance', priority:65,
      evaluate(ctx){
        const recent = practicesInPeriod('week');
        if(ctx.total >= 8 && recent.some(p => p.intention === 'maximum') && !recent.some(p => p.intention === 'recovery')){
          return `You sent a Maximum signal this week without any Active Recovery around it.`;
        }
        return null;
      },
    },
    {
      id:'neglected-pillars', category:'movement', priority:55,
      evaluate(ctx){
        const missing = PILLARS.filter(p => !ctx.balance[p.key]).map(p => p.label);
        if(ctx.total >= 8 && missing.length > 0){
          return `${missing.join(' and ')} ${missing.length === 1 ? 'hasn\u2019t' : 'haven\u2019t'} been practiced in the last two months.`;
        }
        return null;
      },
    },
    {
      id:'all-pillars-touched', category:'movement', priority:30,
      evaluate(ctx){
        if(ctx.total >= 8 && PILLARS.every(p => ctx.balance[p.key])){
          return `Push, Pull, Core, and Legs have all been active in the last two months.`;
        }
        return null;
      },
    },
    {
      id:'time-of-day', category:'pattern', priority:12,
      evaluate(ctx){
        const p = ctx.patterns;
        if(p && p.total >= 10){
          const morningShare = p.morning / p.total;
          if(morningShare >= 0.7) return `Most of your signals arrive in the morning.`;
          if(morningShare <= 0.3) return `Most of your signals arrive in the evening.`;
        }
        return null;
      },
    },
  ];

  function runInsightEngine(limit){
    if(state.practices.length === 0) return [];
    const ctx = {
      total: state.practices.length,
      rhythm: computeRhythm(),
      challenge: computeChallenge('week'),
      recovery: computeRecovery(),
      balance: computeBalance(),
      signalBalance: computeSignalBalance(),
      consistency: computeConsistency(),
      patterns: computePracticePatterns(),
    };

    const insights = [];
    computeMilestonesToday().forEach(m => insights.push({ id:m.id, text:m.text, priority:100, category:'milestone' }));
    computeRecordsToday().forEach(r => insights.push({ id:r.id, text:r.text, priority:95, category:'record' }));
    INSIGHT_RULES.forEach(rule => {
      const text = rule.evaluate(ctx);
      if(text) insights.push({ id:rule.id, text, priority:rule.priority, category:rule.category });
    });

    insights.sort((a,b) => b.priority - a.priority);
    return insights.slice(0, limit || 5);
  }

  function computeWeeklyReflection(){
    const week = practicesInPeriod('week');
    if(week.length === 0) return null;

    const distribution = {};
    INTENTIONS.forEach(i => { distribution[i.key] = week.filter(p => p.intention === i.key).length; });

    const moveCounts = {};
    let bestSession = null, bestSessionVolume = -1;
    week.forEach(p => {
      let sessionVolume = 0;
      p.movements.forEach(m => {
        moveCounts[m.name] = (moveCounts[m.name] || 0) + 1;
        sessionVolume += movementNumericValue(m);
      });
      if(sessionVolume > bestSessionVolume){ bestSessionVolume = sessionVolume; bestSession = p; }
    });
    const mostPracticedEntry = Object.entries(moveCounts).sort((a,b) => b[1] - a[1])[0];

    const touchedPillars = PILLARS.filter(pl => week.some(p => p.movements.some(m => MOVEMENT_PILLAR[m.name] === pl.key)));
    const missingPillars = PILLARS.filter(pl => !touchedPillars.includes(pl));

    const recommendedFocus = distribution.growth === 0
      ? 'A Growth signal would round out this week — you haven\u2019t challenged yet.'
      : missingPillars.length
        ? `${missingPillars.map(p => p.label).join(' and ')} could use some attention next week.`
        : 'Keep the rhythm going.';

    return {
      count: week.length,
      distribution,
      mostPracticed: mostPracticedEntry ? mostPracticedEntry[0] : null,
      bestSession,
      bestSessionVolume: bestSessionVolume > 0 ? bestSessionVolume : 0,
      touchedPillars,
      recommendedFocus,
    };
  }

  const STATUS_COLOR = {
    green: 'var(--intent-maintenance)',
    yellow: 'var(--intent-growth)',
    orange: '#c1652b',
    red: 'var(--intent-maximum)',
  };

  function computeOverallStatus(rhythm, challenge, recovery){
    if(state.practices.length === 0){
      return { key:'start', label:'Just Getting Started', color: STATUS_COLOR.yellow,
        text: 'Send your first few signals and Timeless will start reading your rhythm.' };
    }
    const statuses = [rhythm.status, challenge.status, recovery.status].filter(Boolean);
    const reds = statuses.filter(s => s === 'red').length;
    const yellows = statuses.filter(s => s === 'yellow').length;

    let key, label, color;
    if(reds >= 2){ key='fading'; label='Signals Are Fading'; color=STATUS_COLOR.red; }
    else if(reds === 1){ key='inconsistent'; label='Signals Becoming Inconsistent'; color=STATUS_COLOR.orange; }
    else if(yellows >= 1){ key='building'; label='Building Momentum'; color=STATUS_COLOR.yellow; }
    else { key='zone'; label='In the Adaptation Zone'; color=STATUS_COLOR.green; }

    const sentences = [];
    if(rhythm.avg != null){
      sentences.push(rhythm.status === 'green'
        ? `Your rhythm is steady, with an average return of ${rhythm.avg.toFixed(1)} days.`
        : rhythm.status === 'yellow'
          ? `Your rhythm is drifting slightly — average return has stretched to ${rhythm.avg.toFixed(1)} days.`
          : `Your rhythm has drifted — average return is now ${rhythm.avg.toFixed(1)} days. One practice soon will help restore it.`);
    }
    if(challenge.status){
      sentences.push(challenge.status === 'green'

  function renderDonutChart(counts, total){
    const size = 168, radius = 62, cx = size/2, cy = size/2, sw = 20;
    const circumference = 2 * Math.PI * radius;
    if(total === 0){
      return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
        <circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="var(--page-hairline)" stroke-width="${sw}"/>
      </svg>`;
    }
    let offset = 0;
    const segs = INTENTIONS.map(i => {
      const val = counts[i.key] || 0;
      if(val === 0) return '';
      const len = (val/total) * circumference;
      const gap = Math.max(circumference - len, 0);
      const circle = `<circle cx="${cx}" cy="${cy}" r="${radius}" fill="none" stroke="${i.color}" stroke-width="${sw}"
        stroke-dasharray="${len} ${gap}" stroke-dashoffset="${-offset}" transform="rotate(-90 ${cx} ${cy})" />`;
      offset += len;
      return circle;
    }).join('');
    return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">${segs}</svg>`;
  }

  const ADAPTATION_LOAD_VALUES = { recovery: -2, maintenance: -1, growth: 1, maximum: 3 };
  const ADAPTATION_LOAD_MIN = -8;
  const ADAPTATION_LOAD_MAX = 16;

  function computeAdaptationLoad(){
    const now = Date.now();
    const last7 = state.practices.filter(p => (now - new Date(p.savedAt).getTime()) / 86400000 <= 7);
    return last7.reduce((sum, p) => sum + (ADAPTATION_LOAD_VALUES[p.intention] || 0), 0);
  }

  function computeAdaptationZone(){
    if(state.practices.length === 0) return { position: 4, label: 'Low', load: 0 };
    const load = computeAdaptationLoad();
    const clamped = Math.max(ADAPTATION_LOAD_MIN, Math.min(ADAPTATION_LOAD_MAX, load));
    const position = ((clamped - ADAPTATION_LOAD_MIN) / (ADAPTATION_LOAD_MAX - ADAPTATION_LOAD_MIN)) * 100;
    let label = 'Optimal';
    if(load < 0) label = 'Low';
    else if(load > 10) label = 'High';
    return { position, label, load };
  }

  function filteredMovements(){
    const q = state.searchQuery.trim().toLowerCase();

  function groupMovementsByPillar(names){
    const groups = PILLARS.map(p => ({ key: p.key, label: p.label, items: [] }));
    const other = { key: 'other', label: 'General', items: [] };
    names.forEach(name => {
      const pillarKey = MOVEMENT_PILLAR[name];
      const group = groups.find(g => g.key === pillarKey);
      (group || other).items.push(name);
    });
    return [...groups, other].filter(g => g.items.length > 0);
  }

  /* ---------------- actions ---------------- */

  function initDraftForToday(){
    const existing = state.practices.find(p => p.dateKey === todayKey());
    if(existing){
      state.draft = {
        id: existing.id,
        dateKey: existing.dateKey,
        movements: JSON.parse(JSON.stringify(existing.movements)),
        intention: existing.intention,
      };
    } else {
      state.draft = freshDraft();
    }
  }

  function addMovement(name){
    const spec = MOVEMENTS.find(m => m.name === name);
    if(!spec) return;
    const type = 'reps';
    state.draft.movements.push({
      id: uid(),
      name: spec.name,
      type,
      values: defaultValuesForType(type),
    });
  }

  function handlePickSignal(key, buttonEl){
    if(!key || !buttonEl) return;
    const container = buttonEl.parentElement;
    if(container){
      const options = Array.from(container.children);
      options.forEach(opt => {
        if(opt === buttonEl){
          opt.style.transition = 'transform .22s ' + 'cubic-bezier(.34,1.4,.4,1)';
          opt.style.transform = 'scale(0.98)';
        } else {
          opt.style.pointerEvents = 'none';
          opt.style.transition = 'opacity .26s ease, transform .26s ease';
          opt.style.opacity = '0';
          opt.style.transform = 'translateY(-4px)';
        }
      });
    }
    setTimeout(() => {
      state.draft.intention = key;
      state.justPickedSignal = true;
      render();
      setTimeout(() => { state.justPickedSignal = false; }, 420);
    }, 260);
  }

  function savePractice(){
    if(state.draft.movements.length === 0) return;
    state.savingAnim = true;
    render();
    setTimeout(() => {
      const dKey = state.draft.dateKey || todayKey();
      const now = new Date();
      let savedPractice = null;

      if(state.draft.id){
        // one card per day: update the existing record in place
        const idx = state.practices.findIndex(p => p.id === state.draft.id);
        if(idx > -1){
          state.practices[idx] = {
            ...state.practices[idx],
            movements: state.draft.movements,
            intention: state.draft.intention,
            updatedAt: now.toISOString(),
          };
          savedPractice = state.practices[idx];
        }
      } else {
        const practice = {
          id: uid(),
          savedAt: now.toISOString(),
          dateKey: dKey,
          movements: state.draft.movements,
          intention: state.draft.intention,
        };
        state.practices.unshift(practice);
        savedPractice = practice;
      }

      state.draft = freshDraft();
      state.savingAnim = false;
      state.practiceContinued = false;
      state.openPillar = null;
      state.openMovementName = null;
      state.view = 'adaptation';
      render();

      if(savedPractice) syncApi.pushPractice(savedPractice);
    }, 520);
  }

  /* ---------------- event delegation ---------------- */

  const NAV_SCROLL_TOP_ACTIONS = new Set([
    'nav-practice', 'nav-methods', 'nav-adaptation',
    'open-pillar', 'close-pillar',
    'open-movement', 'close-movement',
    'open-method', 'close-method',
    'open-pillar-from-method',
    'back-to-picker', 'back-to-practice',
    'continue-to-signal', 'pick-signal',
  ]);

  document.addEventListener('click', function(e){
    const el = e.target.closest('[data-action]');

    // clicking scrim background closes overlay, but not when clicking inner panel
    if(el && el.dataset.action && el.dataset.action.endsWith('-scrim')){
      if(e.target !== el) return; // clicked inside panel, ignore
    }

    if(!el) return;
    const action = el.dataset.action;

    switch(action){
      case 'nav-practice':
        state.view = 'practice';
        state.openPillar = null;
        state.openMovementName = null;
        if(!state.draft.intention) state.practiceContinued = false;
        render();
        break;
      case 'nav-adaptation':
        state.view = 'adaptation'; render(); break;
      case 'nav-methods':
        state.view = 'methods';
        state.openMethod = null;
        render();
        break;

      case 'open-method':
        state.openMethod = el.dataset.key;
        render();
        break;
      case 'close-method':
        state.openMethod = null;
        render();
        break;
      case 'open-pillar-from-method':
        state.view = 'practice';
        state.openMethod = null;
        state.openMovementName = null;
        state.openPillar = el.dataset.key;
        render();
        break;

      case 'show-login':
        state.authView = 'login'; state.authError = null; state.authNotice = null; render(); break;
      case 'show-signup':
        state.authView = 'signup'; state.authError = null; state.authNotice = null; render(); break;
      case 'show-forgot':
        state.authView = 'forgot'; state.authError = null; state.authNotice = null; render(); break;
      case 'close-auth':
        state.authView = null; state.authError = null; state.authNotice = null; render(); break;
      case 'set-login-method':
        state.loginMethod = el.dataset.method; state.authError = null; render(); break;
      case 'log-out':
        authApi.logOut();
        state.user = null;
        state.accountMenuOpen = false;
        render();
        break;
      case 'toggle-account-menu':
        state.accountMenuOpen = !state.accountMenuOpen;
        render();
        break;
      case 'close-account-menu-scrim':
        state.accountMenuOpen = false;
        render();
        break;

      case 'set-challenge-period':
        state.challengePeriod = el.dataset.period;
        render();
        break;

      case 'open-search':
        state.searchOpen = true;
        state.searchQuery = '';
        state.searchTab = state.myPractice.length ? 'mine' : 'all';
        render();
        break;
      case 'close-search-scrim':
        state.searchOpen = false; render(); break;

      case 'set-search-tab':
        state.searchTab = el.dataset.tab;
        render();
        break;

      case 'select-movement':
        addMovement(el.dataset.name);
        state.searchOpen = false;
        state.searchQuery = '';
        render();
        break;

      case 'open-pillar':
        state.openPillar = el.dataset.key;
        state.openMovementName = null;
        render();
        break;
      case 'close-pillar':
        state.openPillar = null;
        state.openMovementName = null;
        render();
        break;

      case 'open-movement':
        state.openMovementName = el.dataset.name;
        render();
        break;
      case 'close-movement':
        state.openMovementName = null;
        render();
        break;

      case 'add-to-my-practice':
        if(!state.myPractice.includes(el.dataset.name)){
          state.myPractice.push(el.dataset.name);
        }
        render();
        break;

      case 'open-log-sheet':
        state.loggingMovementName = el.dataset.name;
        render();
        break;
      case 'close-log-sheet-scrim':
        state.loggingMovementName = null;
        render();
        break;

      case 'submit-log': {
        const repsInput = document.getElementById('log-sheet-reps');
        const reps = repsInput ? (parseInt(repsInput.value, 10) || 0) : 0;
        const name = el.dataset.name;
        const existing = state.draft.movements.find(m => m.name === name);
        if(existing){
          existing.values.reps = reps;
        } else {
          state.draft.movements.push({
            id: uid(),
            name,
            type: 'reps',
            values: { reps },
          });
        }
        state.loggingMovementName = null;
        state.openMovementName = null;
        state.openPillar = null;
        render();
        break;
      }

      case 'continue-to-signal':
        state.practiceContinued = true;
        render();
        break;

      case 'open-type-menu':
        state.typeMenuId = el.dataset.id; render(); break;
      case 'close-type-menu':
      case 'close-type-menu-scrim':
        state.typeMenuId = null; render(); break;

      case 'choose-type': {
        const m = state.draft.movements.find(x => x.id === el.dataset.id);
        if(m){ m.type = el.dataset.type; m.values = defaultValuesForType(m.type); }
        state.typeMenuId = null;
        render();
        break;
      }

      case 'remove-movement': {
        state.draft.movements = state.draft.movements.filter(x => x.id !== el.dataset.id);
        state.typeMenuId = null;
        render();
        break;
      }

      case 'open-card-detail':
        state.cardDetailId = el.dataset.id;
        render();
        break;
      case 'close-card-detail':
      case 'close-card-detail-scrim':
        state.cardDetailId = null;
        render();
        break;

      case 'select-intention':
        state.draft.intention = state.draft.intention === el.dataset.key ? null : el.dataset.key;
        render();
        break;

      case 'pick-signal':
        handlePickSignal(el.dataset.key, el);
        break;

      case 'back-to-picker':
        state.draft.intention = null;
        render();
        break;

      case 'back-to-practice':
        state.practiceContinued = false;
        render();
        break;

      case 'save-practice':
        savePractice();
        break;
    }

    if(NAV_SCROLL_TOP_ACTIONS.has(action)){
      window.scrollTo(0, 0);
    }
  });

  // text inputs: update state without full re-render (preserve focus)
  document.addEventListener('input', function(e){
    if(e.target.id === 'movement-search-input'){
      state.searchQuery = e.target.value;
      const results = document.getElementById('search-results');
      if(results) results.innerHTML = renderSearchResultsHTML();
      return;
    }
    if(e.target.matches('.editable-num')){
      const m = state.draft.movements.find(x => x.id === e.target.dataset.movementId);
      if(m){
        const key = e.target.dataset.fieldKey;
        const raw = e.target.value.replace(/[^0-9.]/g, '');
        const val = raw === '' ? 0 : parseFloat(raw);
        m.values[key] = isNaN(val) ? 0 : val;
        // let the field visually grow/shrink with what's typed, like real typography reflowing
        e.target.style.width = numInputWidth(e.target.value || '0');
      }
      return;
    }
  });

  document.addEventListener('focusout', function(e){
    if(e.target.matches('.editable-num')){
      const m = state.draft.movements.find(x => x.id === e.target.dataset.movementId);
      if(m){
        const key = e.target.dataset.fieldKey;
        const clean = m.values[key];
        e.target.value = clean;
        e.target.style.width = numInputWidth(clean);
      }
      return;
    }
  });

  document.addEventListener('submit', function(e){
    if(!['signup-form','login-form','forgot-form','reset-form'].includes(e.target.id)) return;
    e.preventDefault();
    if(state.authLoading) return;

    if(e.target.id === 'signup-form'){
      const username = document.getElementById('signup-username').value.trim();
      const password = document.getElementById('signup-password').value;
      const confirm = document.getElementById('signup-confirm').value;
      if(username.length < 3){ state.authError = 'Username should be at least 3 characters.'; render(); return; }
      if(password.length < 8){ state.authError = 'Password should be at least 8 characters.'; render(); return; }
      if(password !== confirm){ state.authError = 'Passwords don\u2019t match.'; render(); return; }
      state.authLoading = true; state.authError = null; render();
      authApi.signUpWithUsername(username, password).then(res => {
        state.authLoading = false;
        if(res.error){ state.authError = res.error; render(); return; }
        state.user = { username };
        state.authView = null;
        render();
        syncApi.pushAllLocal();
      });
      return;
    }

    if(e.target.id === 'login-form'){
      const identifier = document.getElementById('login-identifier').value.trim();
      const password = document.getElementById('login-password').value;
      if(!identifier || !password){ state.authError = 'Fill in both fields.'; render(); return; }
      state.authLoading = true; state.authError = null; render();
      const promise = state.loginMethod === 'username'
        ? authApi.logInWithUsername(identifier, password)
        : authApi.logInWithEmail(identifier, password);
      promise.then(res => {
        state.authLoading = false;
        if(res.error){ state.authError = res.error; render(); return; }
        state.user = state.loginMethod === 'username' ? { username: identifier } : { email: identifier };
        state.authView = null;
        render();
        syncApi.pullAll().then(() => { render(); });
      });
      return;
    }

    if(e.target.id === 'forgot-form'){
      const email = document.getElementById('forgot-email').value.trim();
      if(!email){ state.authError = 'Enter your email.'; render(); return; }
      state.authLoading = true; state.authError = null; state.authNotice = null; render();
      authApi.requestPasswordReset(email).then(res => {
        state.authLoading = false;
        if(res.error){ state.authError = res.error; render(); return; }
        state.authNotice = 'Check your email for a reset link.';
        render();
      });
      return;
    }

    if(e.target.id === 'reset-form'){
      const password = document.getElementById('reset-password').value;
      const confirm = document.getElementById('reset-confirm').value;
      if(password.length < 8){ state.authError = 'Password should be at least 8 characters.'; render(); return; }
      if(password !== confirm){ state.authError = 'Passwords don\u2019t match.'; render(); return; }
      state.authLoading = true; state.authError = null; render();
      authApi.updatePassword(password).then(res => {
        state.authLoading = false;
        if(res.error){ state.authError = res.error; render(); return; }
        state.authNotice = 'Password updated. You can log in now.';
        state.authView = 'login';
        render();
      });
      return;
    }
  });

  document.addEventListener('keydown', function(e){
    if(e.target.matches('.editable-num') && e.key === 'Enter'){
      e.preventDefault();
      e.target.blur();
      return;
    }
    if(e.key === 'Escape'){
      if(state.cardDetailId){ state.cardDetailId = null; render(); }
      else if(state.typeMenuId){ state.typeMenuId = null; render(); }
      else if(state.accountMenuOpen){ state.accountMenuOpen = false; render(); }
      else if(state.searchOpen){ state.searchOpen = false; state.searchTarget = null; render(); }
    }
  });

  // If the person arrived here via a Supabase "reset your password" email link,
  // it appends #type=recovery to the URL — send them straight to the reset screen.
  if(window.location.hash.includes('type=recovery')){
    state.authView = 'reset';
  }

  initDraftForToday();
  render();
})();
</script>

<script>
  // Register the service worker for offline app-shell caching.
  // Safe to leave in even before deploying — it just won't register
  // when opened as a local file (file:// has no service worker support).
  if('serviceWorker' in navigator && window.location.protocol !== 'file:'){
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>
</body>
